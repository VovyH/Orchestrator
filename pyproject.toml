[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-sft"
version = "0.1.0"
description = "An Adaptive Sequence-Layout Scheduler for Memory-Efficient Fine-Tuning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VovyH" }]
dependencies = [
    "torch",
    "pyyaml",
]

[project.optional-dependencies]
vlm = ["transformers>=4.45", "pillow", "bitsandbytes"]
flash = ["flash-attn"]

[project.urls]
Homepage = "https://github.com/VovyH/Orchestrator"
Repository = "https://github.com/VovyH/Orchestrator"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.package-data]
orchestrator = ["configs/*.yaml"]
